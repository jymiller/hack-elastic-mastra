services:
  - type: web
    name: great-questions-ai
    runtime: static
    buildCommand: npm ci && npm run build:static
    staticPublishPath: ./dist-static
    routes:
      - type: redirect
        source: /demo
        destination: /
      - type: redirect
        source: /great-questions
        destination: /how-it-worked/
      - type: redirect
        source: /podcast-prep
        destination: /how-it-worked/
      - type: redirect
        source: /agents/*
        destination: /
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'none'; img-src 'self' https://i.ytimg.com data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
